<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 370" width="1280" height="370" fill="none">
  <defs>
    <linearGradient id="arch-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0c16"/>
      <stop offset="100%" stop-color="#06060c"/>
    </linearGradient>
    <pattern id="arch-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#181826" stroke-width="0.7"/>
    </pattern>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#00d9ff"/>
    </marker>
    <marker id="arrow-lime" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#c8f31d"/>
    </marker>
    <marker id="arrow-fuchsia" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#ff4fd8"/>
    </marker>
  </defs>

  <style>
    .arch-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-weight: 800; }
    .arch-sub { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-weight: 500; font-size: 10px; fill: #8a8a9e; }
    .box-title { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight: 900; font-size: 13px; letter-spacing: 1px; }
  </style>

  <!-- Canvas Frame -->
  <rect width="1280" height="370" rx="10" fill="url(#arch-bg-grad)" stroke="#1f1f32" stroke-width="1.5"/>
  <rect width="1280" height="370" rx="10" fill="url(#arch-grid)"/>

  <!-- Top Frame HUD Header -->
  <rect x="0" y="0" width="1280" height="32" rx="10 10 0 0" fill="#090912"/>
  <line x1="0" y1="32" x2="1280" y2="32" stroke="#222234" stroke-width="1"/>
  
  <circle cx="24" cy="16" r="4.5" fill="#c8f31d"/>
  <text class="arch-mono" x="38" y="20" fill="#f7f5ff" font-size="10.5" letter-spacing="2">
    KAZE DISTRIBUTED TOPOLOGY // CLOUD HYBRID &amp; EDGE NETWORKING
  </text>
  <text class="arch-mono" x="1256" y="20" fill="#00d9ff" font-size="10" text-anchor="end" letter-spacing="1">
    TLS 1.3 · ZERO-TRUST WAF · HTTP/3
  </text>

  <!-- ══════════════ 1. CLIENTS BLOCK ══════════════ -->
  <g transform="translate(30, 56)">
    <!-- Container Outline -->
    <rect x="0" y="0" width="220" height="280" rx="8" fill="#0d0d1a" stroke="#2a2a40" stroke-width="1.2"/>
    <rect x="0" y="0" width="220" height="28" rx="8 8 0 0" fill="#131326"/>
    <text class="arch-mono" x="14" y="18" fill="#a855f7" font-size="10" letter-spacing="1.5">01 // CLIENTS LAYER</text>

    <!-- Sub-node: Web App -->
    <g transform="translate(14, 42)">
      <rect x="3" y="3" width="192" height="96" rx="6" fill="#000000"/>
      <rect x="0" y="0" width="192" height="96" rx="6" fill="#141424" stroke="#a855f7" stroke-width="1.5"/>
      <circle cx="16" cy="18" r="4" fill="#a855f7"/>
      <text class="box-title" x="28" y="21" fill="#f7f5ff">KAZE WEB</text>
      <text class="arch-sub" x="16" y="44">Next.js 16 (App Router)</text>
      <text class="arch-sub" x="16" y="60">React 19 · "use cache"</text>
      <text class="arch-sub" x="16" y="76" fill="#a855f7">Tailwind v4 · Motion</text>
    </g>

    <!-- Sub-node: Android App -->
    <g transform="translate(14, 154)">
      <rect x="3" y="3" width="192" height="106" rx="6" fill="#000000"/>
      <rect x="0" y="0" width="192" height="106" rx="6" fill="#141424" stroke="#c8f31d" stroke-width="1.5"/>
      <circle cx="16" cy="18" r="4" fill="#c8f31d"/>
      <text class="box-title" x="28" y="21" fill="#c8f31d">KAZE ANDROID</text>
      <text class="arch-sub" x="16" y="44">Kotlin 2.0 + Compose</text>
      <text class="arch-sub" x="16" y="60">Media3 ExoPlayer · PiP</text>
      <text class="arch-sub" x="16" y="76">Room Local Cache</text>
      <text class="arch-sub" x="16" y="92" fill="#c8f31d">Auto OTA Update</text>
    </g>
  </g>

  <!-- ══════════════ 2. CLOUDFLARE EDGE & PROXY ══════════════ -->
  <g transform="translate(290, 56)">
    <rect x="0" y="0" width="220" height="280" rx="8" fill="#0d0d1a" stroke="#2a2a40" stroke-width="1.2"/>
    <rect x="0" y="0" width="220" height="28" rx="8 8 0 0" fill="#131326"/>
    <text class="arch-mono" x="14" y="18" fill="#f38020" font-size="10" letter-spacing="1.5">02 // CLOUDFLARE EDGE</text>

    <!-- Node: Cloudflare DNS / Cache / WAF -->
    <g transform="translate(14, 42)">
      <rect x="3" y="3" width="192" height="96" rx="6" fill="#000000"/>
      <rect x="0" y="0" width="192" height="96" rx="6" fill="#18131d" stroke="#f38020" stroke-width="1.5"/>
      <circle cx="16" cy="18" r="4" fill="#f38020"/>
      <text class="box-title" x="28" y="21" fill="#f7f5ff">CF DNS &amp; CACHE</text>
      <text class="arch-sub" x="16" y="44">Edge Reverse Proxy</text>
      <text class="arch-sub" x="16" y="60">DDoS &amp; WAF Ruleset</text>
      <text class="arch-sub" x="16" y="76" fill="#f38020">orunei.sbs / kaze.apk</text>
    </g>

    <!-- Node: Video Proxy Worker -->
    <g transform="translate(14, 154)">
      <rect x="3" y="3" width="192" height="106" rx="6" fill="#000000"/>
      <rect x="0" y="0" width="192" height="106" rx="6" fill="#18131d" stroke="#00d9ff" stroke-width="1.5"/>
      <circle cx="16" cy="18" r="4" fill="#00d9ff"/>
      <text class="box-title" x="28" y="21" fill="#00d9ff">CF STREAM WORKER</text>
      <text class="arch-sub" x="16" y="44">HLS M3U8 Rewriter</text>
      <text class="arch-sub" x="16" y="60">CORS &amp; Referer Bypass</text>
      <text class="arch-sub" x="16" y="76">Dual Failover Stream</text>
      <text class="arch-sub" x="16" y="92" fill="#00d9ff">Zero Buffer Latency</text>
    </g>
  </g>

  <!-- ══════════════ 3. VPS STANDALONE INFRA ══════════════ -->
  <g transform="translate(550, 56)">
    <rect x="0" y="0" width="360" height="280" rx="8" fill="#0d0d1a" stroke="#2a2a40" stroke-width="1.2"/>
    <rect x="0" y="0" width="360" height="28" rx="8 8 0 0" fill="#131326"/>
    <text class="arch-mono" x="14" y="18" fill="#00d9ff" font-size="10" letter-spacing="1.5">03 // DEDICATED VPS HOST (UBUNTU)</text>

    <!-- Sub-node: Caddy Reverse Proxy -->
    <g transform="translate(14, 42)">
      <rect x="3" y="3" width="156" height="96" rx="6" fill="#000000"/>
      <rect x="0" y="0" width="156" height="96" rx="6" fill="#141926" stroke="#00d9ff" stroke-width="1.5"/>
      <circle cx="16" cy="18" r="4" fill="#00d9ff"/>
      <text class="box-title" x="28" y="21" fill="#f7f5ff">CADDY 2</text>
      <text class="arch-sub" x="14" y="44">Auto TLS / HTTPS</text>
      <text class="arch-sub" x="14" y="60">CF-IP Filtering</text>
      <text class="arch-sub" x="14" y="76" fill="#00d9ff">Upstream Proxy</text>
    </g>

    <!-- Sub-node: Next.js Standalone -->
    <g transform="translate(186, 42)">
      <rect x="3" y="3" width="156" height="96" rx="6" fill="#000000"/>
      <rect x="0" y="0" width="156" height="96" rx="6" fill="#141424" stroke="#a855f7" stroke-width="1.5"/>
      <circle cx="16" cy="18" r="4" fill="#a855f7"/>
      <text class="box-title" x="28" y="21" fill="#f7f5ff">NEXT.JS DAEMON</text>
      <text class="arch-sub" x="14" y="44">Standalone Node</text>
      <text class="arch-sub" x="14" y="60">Systemd Service</text>
      <text class="arch-sub" x="14" y="76" fill="#a855f7">Zero-Downtime Rollback</text>
    </g>

    <!-- Sub-node: Resolver Node & Redis -->
    <g transform="translate(14, 154)">
      <rect x="3" y="3" width="156" height="106" rx="6" fill="#000000"/>
      <rect x="0" y="0" width="156" height="106" rx="6" fill="#171424" stroke="#ff4fd8" stroke-width="1.5"/>
      <circle cx="16" cy="18" r="4" fill="#ff4fd8"/>
      <text class="box-title" x="28" y="21" fill="#ff4fd8">STREAM RESOLVER</text>
      <text class="arch-sub" x="14" y="44">Node.js Engine</text>
      <text class="arch-sub" x="14" y="60">Redis Stream Cache</text>
      <text class="arch-sub" x="14" y="76">Auto Fallback</text>
      <text class="arch-sub" x="14" y="92" fill="#ff4fd8">&lt; 150ms Response</text>
    </g>

    <!-- Sub-node: APK & Static files -->
    <g transform="translate(186, 154)">
      <rect x="3" y="3" width="156" height="106" rx="6" fill="#000000"/>
      <rect x="0" y="0" width="156" height="106" rx="6" fill="#161c14" stroke="#c8f31d" stroke-width="1.5"/>
      <circle cx="16" cy="18" r="4" fill="#c8f31d"/>
      <text class="box-title" x="28" y="21" fill="#c8f31d">APK DISTRIBUTION</text>
      <text class="arch-sub" x="14" y="44">kaze.apk (v0.3.0)</text>
      <text class="arch-sub" x="14" y="60">version.json Hash</text>
      <text class="arch-sub" x="14" y="76">Release Manifest</text>
      <text class="arch-sub" x="14" y="92" fill="#c8f31d">Instant Download</text>
    </g>
  </g>

  <!-- ══════════════ 4. SUPABASE & ANILIST ══════════════ -->
  <g transform="translate(950, 56)">
    <rect x="0" y="0" width="300" height="280" rx="8" fill="#0d0d1a" stroke="#2a2a40" stroke-width="1.2"/>
    <rect x="0" y="0" width="300" height="28" rx="8 8 0 0" fill="#131326"/>
    <text class="arch-mono" x="14" y="18" fill="#3ecf8e" font-size="10" letter-spacing="1.5">04 // STATE, DATA &amp; APIS</text>

    <!-- Node: Supabase -->
    <g transform="translate(14, 42)">
      <rect x="3" y="3" width="270" height="96" rx="6" fill="#000000"/>
      <rect x="0" y="0" width="270" height="96" rx="6" fill="#111c18" stroke="#3ecf8e" stroke-width="1.5"/>
      <circle cx="16" cy="18" r="4" fill="#3ecf8e"/>
      <text class="box-title" x="28" y="21" fill="#3ecf8e">SUPABASE (POSTGRES + RT)</text>
      <text class="arch-sub" x="16" y="44">Row Level Security (RLS) Policies</text>
      <text class="arch-sub" x="16" y="60">Realtime Presence &amp; Watch Party Chat</text>
      <text class="arch-sub" x="16" y="76" fill="#3ecf8e">Auth + Encrypted Tokens (AES-256-GCM)</text>
    </g>

    <!-- Node: AniList GraphQL API -->
    <g transform="translate(14, 154)">
      <rect x="3" y="3" width="270" height="106" rx="6" fill="#000000"/>
      <rect x="0" y="0" width="270" height="106" rx="6" fill="#101928" stroke="#00d9ff" stroke-width="1.5"/>
      <circle cx="16" cy="18" r="4" fill="#00d9ff"/>
      <text class="box-title" x="28" y="21" fill="#00d9ff">ANILIST GRAPHQL API</text>
      <text class="arch-sub" x="16" y="44">Anime &amp; Manga Comprehensive Metadata</text>
      <text class="arch-sub" x="16" y="60">Characters, Airing Schedule &amp; Relations</text>
      <text class="arch-sub" x="16" y="76">User List Import &amp; Export Sync</text>
      <text class="arch-sub" x="16" y="92" fill="#00d9ff">OAuth 2.0 PKCE Handshake</text>
    </g>
  </g>

  <!-- ══════════════ DATA BUS CONNECTIONS ══════════════ -->
  <!-- Client to Cloudflare -->
  <line x1="250" y1="145" x2="290" y2="145" stroke="#00d9ff" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <!-- Cloudflare to Caddy -->
  <line x1="510" y1="145" x2="550" y2="145" stroke="#00d9ff" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <!-- Next.js to Supabase & AniList -->
  <line x1="910" y1="145" x2="950" y2="145" stroke="#c8f31d" stroke-width="2" marker-end="url(#arrow-lime)"/>
  <!-- Stream Worker to Cloudflare / Client -->
  <line x1="400" y1="260" x2="400" y2="280" stroke="#ff4fd8" stroke-width="1.5" stroke-dasharray="4 4"/>
</svg>