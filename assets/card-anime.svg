<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320" width="620" height="320" fill="none">
  <defs>
    <linearGradient id="film-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12121f"/>
      <stop offset="100%" stop-color="#0a0a14"/>
    </linearGradient>
    <linearGradient id="neon-badge-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ff4fd8"/>
    </linearGradient>
  </defs>
  <style>
    .mono-bold { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-weight: 800; }
    .mono-reg { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-weight: 500; }
    .card-title { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight: 900; }
  </style>

  <!-- Hard Shadow Offset -->
  <rect x="6" y="6" width="608" height="308" rx="8" fill="#000000"/>
  
  <!-- Main Card Body (Film Frame Negative) -->
  <rect x="0" y="0" width="608" height="308" rx="8" fill="url(#film-grad-1)" stroke="#252538" stroke-width="1.5"/>

  <!-- Top Sprocket Bar -->
  <rect x="0" y="0" width="608" height="28" fill="#090912" rx="8 8 0 0"/>
  <line x1="0" y1="28" x2="608" y2="28" stroke="#1f1f2e" stroke-width="1"/>
  <!-- Sprocket Holes -->
  <g fill="#050508" stroke="#252538" stroke-width="0.8">
    <rect x="20" y="7" width="16" height="14" rx="2.5"/>
    <rect x="56" y="7" width="16" height="14" rx="2.5"/>
    <rect x="92" y="7" width="16" height="14" rx="2.5"/>
    <rect x="128" y="7" width="16" height="14" rx="2.5"/>
    <rect x="464" y="7" width="16" height="14" rx="2.5"/>
    <rect x="500" y="7" width="16" height="14" rx="2.5"/>
    <rect x="536" y="7" width="16" height="14" rx="2.5"/>
    <rect x="572" y="7" width="16" height="14" rx="2.5"/>
  </g>
  <!-- Film Bar Text -->
  <text class="mono-bold" x="160" y="19" fill="#c8f31d" font-size="9" letter-spacing="2">KAZE 100 // 01 · STREAMING</text>
  <text class="mono-reg" x="380" y="19" fill="#6d5ef8" font-size="9" letter-spacing="1">EXP 36 · HLS FAILOVER</text>

  <!-- Big Watermark Kanji Background (動画 - Anime/Video) -->
  <text x="500" y="180" fill="#a855f7" fill-opacity="0.08" font-family="'Noto Sans JP', sans-serif" font-size="120" font-weight="900" text-anchor="middle">動画</text>

  <!-- Card Content -->
  <!-- Status Badge Capsule -->
  <g transform="translate(24, 46)">
    <rect x="2" y="2" width="160" height="22" rx="5" fill="#000000"/>
    <rect x="0" y="0" width="160" height="22" rx="5" fill="#1b122c" stroke="#a855f7" stroke-width="1.2"/>
    <circle cx="12" cy="11" r="3.5" fill="#ff4fd8"/>
    <text class="mono-bold" x="24" y="15" fill="#f7f5ff" font-size="9.5" letter-spacing="1">DUAL-RESOLVER · HLS</text>
  </g>

  <!-- Card Title -->
  <text class="card-title" x="24" y="104" fill="#f7f5ff" font-size="28" letter-spacing="1">STREAMING &amp; ANIME</text>

  <!-- Feature Bullet Points -->
  <g class="mono-reg" font-size="11.5" fill="#a9a6c4" transform="translate(24, 132)">
    <text x="0" y="0">
      <tspan fill="#c8f31d" font-weight="800">▸ </tspan>Reproductor HLS multiserver con conmutación automática
    </text>
    <text x="0" y="22">
      <tspan fill="#ff4fd8" font-weight="800">▸ </tspan>Selector de Audio Dual: Japonés subtitulado o Doblaje Latino
    </text>
    <text x="0" y="44">
      <tspan fill="#00d9ff" font-weight="800">▸ </tspan>Salto automático de Opening y Ending impulsado por AniSkip
    </text>
    <text x="0" y="66">
      <tspan fill="#a855f7" font-weight="800">▸ </tspan>Memoria de progreso exacto sincronizada web ↔ móvil
    </text>
  </g>

  <!-- Bottom Tech Pills -->
  <g transform="translate(24, 230)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="76" height="24" rx="4" fill="#090912" stroke="#252538" stroke-width="1"/>
    <text class="mono-bold" x="38" y="16" fill="#f7f5ff" font-size="9" text-anchor="middle">HLS.JS</text>
    <!-- Pill 2 -->
    <rect x="84" y="0" width="86" height="24" rx="4" fill="#090912" stroke="#252538" stroke-width="1"/>
    <text class="mono-bold" x="127" y="16" fill="#a855f7" font-size="9" text-anchor="middle">REDIS NODE</text>
    <!-- Pill 3 -->
    <rect x="178" y="0" width="84" height="24" rx="4" fill="#090912" stroke="#252538" stroke-width="1"/>
    <text class="mono-bold" x="220" y="16" fill="#c8f31d" font-size="9" text-anchor="middle">ANISKIP</text>
    <!-- Pill 4 -->
    <rect x="270" y="0" width="94" height="24" rx="4" fill="#090912" stroke="#252538" stroke-width="1"/>
    <text class="mono-bold" x="317" y="16" fill="#ff4fd8" font-size="9" text-anchor="middle">CLOUDFLARE</text>
  </g>

  <!-- Bottom Sprocket Bar -->
  <g transform="translate(0, 280)">
    <rect x="0" y="0" width="608" height="28" fill="#090912" rx="0 0 8 8"/>
    <line x1="0" y1="0" x2="608" y2="0" stroke="#1f1f2e" stroke-width="1"/>
    <g fill="#050508" stroke="#252538" stroke-width="0.8">
      <rect x="20" y="7" width="16" height="14" rx="2.5"/>
      <rect x="56" y="7" width="16" height="14" rx="2.5"/>
      <rect x="92" y="7" width="16" height="14" rx="2.5"/>
      <rect x="128" y="7" width="16" height="14" rx="2.5"/>
      <rect x="464" y="7" width="16" height="14" rx="2.5"/>
      <rect x="500" y="7" width="16" height="14" rx="2.5"/>
      <rect x="536" y="7" width="16" height="14" rx="2.5"/>
      <rect x="572" y="7" width="16" height="14" rx="2.5"/>
    </g>
    <text class="mono-bold" x="240" y="19" fill="#6d5ef8" font-size="9" letter-spacing="2">ORUNEI STREAM RESOLVER // OK</text>
  </g>
</svg>