<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 74" width="1280" height="74" fill="none">
  <defs>
    <linearGradient id="t-arch-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d9ff"/>
      <stop offset="60%" stop-color="#6d5ef8"/>
      <stop offset="100%" stop-color="#080810"/>
    </linearGradient>
    <linearGradient id="tape-mini2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <style>
    .t-title { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 900; letter-spacing: 2px; }
    .t-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-weight: 800; }
  </style>

  <!-- Number & Section Title -->
  <text class="t-mono" x="20" y="46" fill="#00d9ff" font-size="28">// 02</text>
  <text class="t-title" x="90" y="46" fill="#f7f5ff" font-size="28">ARQUITECTURA DE SISTEMA</text>

  <!-- Rotated Neon Pill Sticker -->
  <g transform="translate(560, 20) rotate(1.5)">
    <rect x="3" y="3" width="144" height="28" rx="6" fill="#000000"/>
    <rect x="0" y="0" width="144" height="28" rx="6" fill="#00d9ff" stroke="#000000" stroke-width="1.5"/>
    <text class="t-mono" x="72" y="19" fill="#000000" font-size="11" text-anchor="middle" letter-spacing="1.5">HYBRID CLOUD</text>
    <polygon points="52,-6 92,-6 85,8 45,8" fill="url(#tape-mini2)"/>
  </g>

  <!-- Divider Line -->
  <line x1="720" y1="42" x2="1140" y2="42" stroke="url(#t-arch-grad)" stroke-width="2"/>

  <!-- Right Side Metadata -->
  <text class="t-mono" x="1260" y="44" fill="#00d9ff" font-size="11" text-anchor="end" letter-spacing="1.5">TOPOLOGY // VPS + SUPABASE</text>
</svg>