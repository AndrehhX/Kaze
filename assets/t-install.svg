<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 74" width="1280" height="74" fill="none">
  <defs>
    <linearGradient id="t-inst-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6d5ef8"/>
      <stop offset="60%" stop-color="#c8f31d"/>
      <stop offset="100%" stop-color="#080810"/>
    </linearGradient>
    <linearGradient id="tape-mini5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <style>
    .t-title { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 900; letter-spacing: 2px; }
    .t-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-weight: 800; }
  </style>

  <!-- Number & Section Title -->
  <text class="t-mono" x="20" y="46" fill="#6d5ef8" font-size="28">// 05</text>
  <text class="t-title" x="90" y="46" fill="#f7f5ff" font-size="28">INSTALACIÓN &amp; DESPLIEGUE</text>

  <!-- Rotated Neon Pill Sticker -->
  <g transform="translate(580, 20) rotate(-1.5)">
    <rect x="3" y="3" width="130" height="28" rx="6" fill="#000000"/>
    <rect x="0" y="0" width="130" height="28" rx="6" fill="#6d5ef8" stroke="#000000" stroke-width="1.5"/>
    <text class="t-mono" x="65" y="19" fill="#ffffff" font-size="11" text-anchor="middle" letter-spacing="1.5">QUICKSTART</text>
    <polygon points="45,-6 85,-6 78,8 38,8" fill="url(#tape-mini5)"/>
  </g>

  <!-- Divider Line -->
  <line x1="730" y1="42" x2="1140" y2="42" stroke="url(#t-inst-grad)" stroke-width="2"/>

  <!-- Right Side Metadata -->
  <text class="t-mono" x="1260" y="44" fill="#a9a6c4" font-size="11" text-anchor="end" letter-spacing="1.5">SYSTEMD + DUAL BUILD</text>
</svg>