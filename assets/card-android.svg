<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320" width="620" height="320" fill="none">
  <defs>
    <linearGradient id="film-grad-4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12121f"/>
      <stop offset="100%" stop-color="#0a0a14"/>
    </linearGradient>
  </defs>
  <style>
    .mono-bold { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-weight: 800; }
    .mono-reg { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-weight: 500; }
    .card-title { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight: 900; }
  </style>

  <!-- Hard Shadow Offset -->
  <rect x="6" y="6" width="608" height="308" rx="8" fill="#000000"/>
  
  <!-- Main Card Body -->
  <rect x="0" y="0" width="608" height="308" rx="8" fill="url(#film-grad-4)" stroke="#252538" stroke-width="1.5"/>

  <!-- Top Sprocket Bar -->
  <rect x="0" y="0" width="608" height="28" fill="#090912" rx="8 8 0 0"/>
  <line x1="0" y1="28" x2="608" y2="28" stroke="#1f1f2e" stroke-width="1"/>
  <!-- Sprocket Holes -->
  <g fill="#050508" stroke="#252538" stroke-width="0.8">
    <rect x="20" y="7" width="16" height="14" rx="2.5"/>
    <rect x="56" y="7" width="16" height="14" rx="2.5"/>
    <rect x="92" y="7" width="16" height="14" rx="2.5"/>
    <rect x="128" y="7" width="16" height="14" rx="2.5"/>
    <rect x="464" y="7" width="16" height="14" rx="2.5"/>
    <rect x="500" y="7" width="16" height="14" rx="2.5"/>
    <rect x="536" y="7" width="16" height="14" rx="2.5"/>
    <rect x="572" y="7" width="16" height="14" rx="2.5"/>
  </g>
  <!-- Film Bar Text -->
  <text class="mono-bold" x="160" y="19" fill="#c8f31d" font-size="9" letter-spacing="2">KAZE 100 // 04 · ANDROID NATIVE</text>
  <text class="mono-reg" x="380" y="19" fill="#6d5ef8" font-size="9" letter-spacing="1">EXP 36 · APK v0.3.0</text>

  <!-- Big Watermark Kanji Background (携帯 - Mobile) -->
  <text x="500" y="180" fill="#c8f31d" fill-opacity="0.08" font-family="'Noto Sans JP', sans-serif" font-size="120" font-weight="900" text-anchor="middle">携帯</text>

  <!-- Card Content -->
  <!-- Status Badge Capsule -->
  <g transform="translate(24, 46)">
    <rect x="2" y="2" width="180" height="22" rx="5" fill="#000000"/>
    <rect x="0" y="0" width="180" height="22" rx="5" fill="#15240c" stroke="#c8f31d" stroke-width="1.2"/>
    <circle cx="12" cy="11" r="3.5" fill="#c8f31d"/>
    <text class="mono-bold" x="24" y="15" fill="#c8f31d" font-size="9.5" letter-spacing="1">KOTLIN · JETPACK COMPOSE</text>
  </g>

  <!-- Card Title -->
  <text class="card-title" x="24" y="104" fill="#f7f5ff" font-size="28" letter-spacing="1">APP ANDROID NATIVA</text>

  <!-- Feature Bullet Points -->
  <g class="mono-reg" font-size="11.5" fill="#a9a6c4" transform="translate(24, 132)">
    <text x="0" y="0">
      <tspan fill="#c8f31d" font-weight="800">▸ </tspan>Arquitectura 100% nativa en Kotlin con Jetpack Compose moderno
    </text>
    <text x="0" y="22">
      <tspan fill="#00d9ff" font-weight="800">▸ </tspan>Motor Media3/ExoPlayer con soporte Picture-in-Picture (PiP)
    </text>
    <text x="0" y="44">
      <tspan fill="#ff4fd8" font-weight="800">▸ </tspan>Base de datos local Room: biblioteca offline y sync autónomo
    </text>
    <text x="0" y="66">
      <tspan fill="#a855f7" font-weight="800">▸ </tspan>Detector OTA de versiones: notificación y actualización automática
    </text>
  </g>

  <!-- Bottom Tech Pills -->
  <g transform="translate(24, 230)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="84" height="24" rx="4" fill="#090912" stroke="#252538" stroke-width="1"/>
    <text class="mono-bold" x="42" y="16" fill="#c8f31d" font-size="9" text-anchor="middle">KOTLIN 2.0</text>
    <!-- Pill 2 -->
    <rect x="92" y="0" width="112" height="24" rx="4" fill="#090912" stroke="#252538" stroke-width="1"/>
    <text class="mono-bold" x="148" y="16" fill="#f7f5ff" font-size="9" text-anchor="middle">MEDIA3 EXOPLAYER</text>
    <!-- Pill 3 -->
    <rect x="212" y="0" width="84" height="24" rx="4" fill="#090912" stroke="#252538" stroke-width="1"/>
    <text class="mono-bold" x="254" y="16" fill="#00d9ff" font-size="9" text-anchor="middle">ROOM DB</text>
    <!-- Pill 4 -->
    <rect x="304" y="0" width="88" height="24" rx="4" fill="#090912" stroke="#252538" stroke-width="1"/>
    <text class="mono-bold" x="348" y="16" fill="#ff4fd8" font-size="9" text-anchor="middle">HILT DI</text>
  </g>

  <!-- Bottom Sprocket Bar -->
  <g transform="translate(0, 280)">
    <rect x="0" y="0" width="608" height="28" fill="#090912" rx="0 0 8 8"/>
    <line x1="0" y1="0" x2="608" y2="0" stroke="#1f1f2e" stroke-width="1"/>
    <g fill="#050508" stroke="#252538" stroke-width="0.8">
      <rect x="20" y="7" width="16" height="14" rx="2.5"/>
      <rect x="56" y="7" width="16" height="14" rx="2.5"/>
      <rect x="92" y="7" width="16" height="14" rx="2.5"/>
      <rect x="128" y="7" width="16" height="14" rx="2.5"/>
      <rect x="464" y="7" width="16" height="14" rx="2.5"/>
      <rect x="500" y="7" width="16" height="14" rx="2.5"/>
      <rect x="536" y="7" width="16" height="14" rx="2.5"/>
      <rect x="572" y="7" width="16" height="14" rx="2.5"/>
    </g>
    <text class="mono-bold" x="240" y="19" fill="#c8f31d" font-size="9" letter-spacing="2">ANDROID SDK 35 // COMPOSE</text>
  </g>
</svg>