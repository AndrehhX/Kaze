<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 180" width="1280" height="180" fill="none">
  <defs>
    <pattern id="kraft-dither" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#a855f7" fill-opacity="0.1"/>
      <circle cx="8" cy="8" r="0.8" fill="#c8f31d" fill-opacity="0.08"/>
    </pattern>
    <linearGradient id="tape-grad-wall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.12"/>
    </linearGradient>
  </defs>

  <style>
    .stk-title { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-weight: 800; font-size: 13px; }
    .stk-sub { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-weight: 500; font-size: 9.5px; }
  </style>

  <!-- Wall Background -->
  <rect width="1280" height="180" fill="#080810"/>
  <rect width="1280" height="180" fill="url(#kraft-dither)"/>
  <rect x="0" y="0" width="1280" height="180" stroke="#1f1f30" stroke-width="1.5" fill="none"/>

  <!-- Top Metadata Header Line -->
  <g transform="translate(30, 24)">
    <text font-family="ui-monospace, monospace" font-weight="800" font-size="11" fill="#c8f31d" letter-spacing="2">
      KAZE // PRODUCTION STACK · HYBRID WEB &amp; MOBILE ECOSYSTEM
    </text>
  </g>

  <!-- ROW 1 OF STICKERS -->

  <!-- Sticker 1: Next.js 16 (Black with White/Lime) -->
  <g transform="translate(30, 45) rotate(-1)">
    <rect x="4" y="4" width="180" height="48" rx="6" fill="#000000"/>
    <rect x="0" y="0" width="180" height="48" rx="6" fill="#12121f" stroke="#2e2e42" stroke-width="1.5"/>
    <circle cx="18" cy="24" r="5" fill="#f7f5ff"/>
    <text class="stk-title" x="32" y="22" fill="#f7f5ff">NEXT.JS 16</text>
    <text class="stk-sub" x="32" y="36" fill="#a9a6c4">App Router · Cache</text>
    <!-- Tape -->
    <polygon points="70,-8 110,-8 104,8 64,8" fill="url(#tape-grad-wall)"/>
  </g>

  <!-- Sticker 2: React 19 (Cyan accent) -->
  <g transform="translate(230, 45) rotate(1.2)">
    <rect x="4" y="4" width="160" height="48" rx="6" fill="#000000"/>
    <rect x="0" y="0" width="160" height="48" rx="6" fill="#12121f" stroke="#00d9ff" stroke-width="1.5"/>
    <circle cx="18" cy="24" r="5" fill="#00d9ff"/>
    <text class="stk-title" x="32" y="22" fill="#00d9ff">REACT 19</text>
    <text class="stk-sub" x="32" y="36" fill="#a9a6c4">Server Actions</text>
    <!-- Tape -->
    <polygon points="60,-8 100,-8 94,8 54,8" fill="url(#tape-grad-wall)"/>
  </g>

  <!-- Sticker 3: Supabase (Green/Lime) -->
  <g transform="translate(410, 45) rotate(-1.5)">
    <rect x="4" y="4" width="200" height="48" rx="6" fill="#000000"/>
    <rect x="0" y="0" width="200" height="48" rx="6" fill="#12121f" stroke="#3ecf8e" stroke-width="1.5"/>
    <circle cx="18" cy="24" r="5" fill="#3ecf8e"/>
    <text class="stk-title" x="32" y="22" fill="#3ecf8e">SUPABASE DB</text>
    <text class="stk-sub" x="32" y="36" fill="#a9a6c4">PostgreSQL + Realtime</text>
    <!-- Tape -->
    <polygon points="80,-8 120,-8 114,8 74,8" fill="url(#tape-grad-wall)"/>
  </g>

  <!-- Sticker 4: Kotlin 2.0 (Lime Accent - Signature) -->
  <g transform="translate(630, 45) rotate(0.8)">
    <rect x="4" y="4" width="190" height="48" rx="6" fill="#000000"/>
    <rect x="0" y="0" width="190" height="48" rx="6" fill="#c8f31d" stroke="#000000" stroke-width="1.5"/>
    <rect x="12" y="18" width="12" height="12" rx="2" fill="#000000"/>
    <text class="stk-title" x="32" y="22" fill="#000000">KOTLIN NATIVE</text>
    <text class="stk-sub" x="32" y="36" fill="#1a1a24">Jetpack Compose MVI</text>
    <!-- Tape -->
    <polygon points="75,-8 115,-8 109,8 69,8" fill="url(#tape-grad-wall)"/>
  </g>

  <!-- Sticker 5: Media3 ExoPlayer -->
  <g transform="translate(840, 45) rotate(-0.5)">
    <rect x="4" y="4" width="200" height="48" rx="6" fill="#000000"/>
    <rect x="0" y="0" width="200" height="48" rx="6" fill="#12121f" stroke="#ff4fd8" stroke-width="1.5"/>
    <circle cx="18" cy="24" r="5" fill="#ff4fd8"/>
    <text class="stk-title" x="32" y="22" fill="#ff4fd8">MEDIA3 EXOPLAYER</text>
    <text class="stk-sub" x="32" y="36" fill="#a9a6c4">HLS Engine · PiP</text>
    <!-- Tape -->
    <polygon points="80,-8 120,-8 114,8 74,8" fill="url(#tape-grad-wall)"/>
  </g>

  <!-- Sticker 6: Cloudflare -->
  <g transform="translate(1060, 45) rotate(1.8)">
    <rect x="4" y="4" width="190" height="48" rx="6" fill="#000000"/>
    <rect x="0" y="0" width="190" height="48" rx="6" fill="#12121f" stroke="#f38020" stroke-width="1.5"/>
    <circle cx="18" cy="24" r="5" fill="#f38020"/>
    <text class="stk-title" x="32" y="22" fill="#f38020">CLOUDFLARE</text>
    <text class="stk-sub" x="32" y="36" fill="#a9a6c4">WAF · Video Worker</text>
    <!-- Tape -->
    <polygon points="75,-8 115,-8 109,8 69,8" fill="url(#tape-grad-wall)"/>
  </g>

  <!-- ROW 2 OF STICKERS -->

  <!-- Sticker 7: Tailwind v4 + Motion -->
  <g transform="translate(30, 110) rotate(1.2)">
    <rect x="4" y="4" width="180" height="48" rx="6" fill="#000000"/>
    <rect x="0" y="0" width="180" height="48" rx="6" fill="#12121f" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="18" cy="24" r="5" fill="#38bdf8"/>
    <text class="stk-title" x="32" y="22" fill="#38bdf8">TAILWIND V4</text>
    <text class="stk-sub" x="32" y="36" fill="#a9a6c4">CSS Tokens · Motion</text>
    <!-- Tape -->
    <polygon points="70,-8 110,-8 104,8 64,8" fill="url(#tape-grad-wall)"/>
  </g>

  <!-- Sticker 8: Room SQLite -->
  <g transform="translate(230, 110) rotate(-1)">
    <rect x="4" y="4" width="160" height="48" rx="6" fill="#000000"/>
    <rect x="0" y="0" width="160" height="48" rx="6" fill="#12121f" stroke="#a855f7" stroke-width="1.5"/>
    <circle cx="18" cy="24" r="5" fill="#a855f7"/>
    <text class="stk-title" x="32" y="22" fill="#a855f7">ROOM DB</text>
    <text class="stk-sub" x="32" y="36" fill="#a9a6c4">Local Offline Store</text>
    <!-- Tape -->
    <polygon points="60,-8 100,-8 94,8 54,8" fill="url(#tape-grad-wall)"/>
  </g>

  <!-- Sticker 9: AniList GraphQL -->
  <g transform="translate(410, 110) rotate(1.6)">
    <rect x="4" y="4" width="200" height="48" rx="6" fill="#000000"/>
    <rect x="0" y="0" width="200" height="48" rx="6" fill="#12121f" stroke="#00d9ff" stroke-width="1.5"/>
    <circle cx="18" cy="24" r="5" fill="#00d9ff"/>
    <text class="stk-title" x="32" y="22" fill="#00d9ff">ANILIST GRAPHQL</text>
    <text class="stk-sub" x="32" y="36" fill="#a9a6c4">Metadata + Sync API</text>
    <!-- Tape -->
    <polygon points="80,-8 120,-8 114,8 74,8" fill="url(#tape-grad-wall)"/>
  </g>

  <!-- Sticker 10: Zustand & TanStack -->
  <g transform="translate(630, 110) rotate(-1.4)">
    <rect x="4" y="4" width="190" height="48" rx="6" fill="#000000"/>
    <rect x="0" y="0" width="190" height="48" rx="6" fill="#12121f" stroke="#ff4fd8" stroke-width="1.5"/>
    <circle cx="18" cy="24" r="5" fill="#ff4fd8"/>
    <text class="stk-title" x="32" y="22" fill="#ff4fd8">ZUSTAND STATE</text>
    <text class="stk-sub" x="32" y="36" fill="#a9a6c4">TanStack Query + Zod</text>
    <!-- Tape -->
    <polygon points="75,-8 115,-8 109,8 69,8" fill="url(#tape-grad-wall)"/>
  </g>

  <!-- Sticker 11: Caddy & Systemd -->
  <g transform="translate(840, 110) rotate(1.1)">
    <rect x="4" y="4" width="200" height="48" rx="6" fill="#000000"/>
    <rect x="0" y="0" width="200" height="48" rx="6" fill="#12121f" stroke="#c8f31d" stroke-width="1.5"/>
    <circle cx="18" cy="24" r="5" fill="#c8f31d"/>
    <text class="stk-title" x="32" y="22" fill="#c8f31d">CADDY + VPS</text>
    <text class="stk-sub" x="32" y="36" fill="#a9a6c4">Reverse Proxy · Systemd</text>
    <!-- Tape -->
    <polygon points="80,-8 120,-8 114,8 74,8" fill="url(#tape-grad-wall)"/>
  </g>

  <!-- Sticker 12: Vitest & Playwright -->
  <g transform="translate(1060, 110) rotate(-1)">
    <rect x="4" y="4" width="190" height="48" rx="6" fill="#000000"/>
    <rect x="0" y="0" width="190" height="48" rx="6" fill="#12121f" stroke="#a855f7" stroke-width="1.5"/>
    <circle cx="18" cy="24" r="5" fill="#a855f7"/>
    <text class="stk-title" x="32" y="22" fill="#a855f7">TESTING SUITE</text>
    <text class="stk-sub" x="32" y="36" fill="#a9a6c4">Vitest · Playwright E2E</text>
    <!-- Tape -->
    <polygon points="75,-8 115,-8 109,8 69,8" fill="url(#tape-grad-wall)"/>
  </g>
</svg>