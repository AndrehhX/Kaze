<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 62" width="290" height="62" fill="none">
  <style>
    .btn-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-weight: 800; }
    .btn-sub { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-weight: 500; font-size: 10px; fill: #000000; }
  </style>

  <!-- Hard Shadow Offset -->
  <rect x="5" y="5" width="280" height="52" rx="10" fill="#000000"/>
  <!-- Button Body in Acid Lime -->
  <rect x="0" y="0" width="280" height="52" rx="10" fill="#c8f31d" stroke="#000000" stroke-width="2"/>
  
  <!-- Android Mini Icon -->
  <g transform="translate(18, 17)">
    <path d="M4 14 L4 9 A5 5 0 0 1 14 9 L14 14 Z" fill="#000000"/>
    <circle cx="6.5" cy="8" r="0.9" fill="#c8f31d"/>
    <circle cx="11.5" cy="8" r="0.9" fill="#c8f31d"/>
    <line x1="5" y1="4" x2="3" y2="1.5" stroke="#000000" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="13" y1="4" x2="15" y2="1.5" stroke="#000000" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Text -->
  <text class="btn-mono" x="44" y="25" fill="#000000" font-size="14" letter-spacing="1">DESCARGAR APK</text>
  <text class="btn-sub" x="44" y="40">v0.3.0 · Kotlin Native / Media3</text>

  <!-- Arrow Badge -->
  <rect x="236" y="12" width="28" height="28" rx="6" fill="#000000"/>
  <path d="M245 26 L255 16 M248 16 L255 16 L255 23" stroke="#c8f31d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>