    <rect x="80" y="1240" width="640" height="102.8" rx="14" fill="#3a0f3d" stroke="#7ee8fa" stroke-width="2.5" opacity="0.94"/><text font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" fill="#eafbff"><tspan x="100" y="1287.2">«...si alguien escucha esto... la torre del</tspan><tspan x="100" y="1323.6000000000001">puerto... a las tres...»</tspan></text>
